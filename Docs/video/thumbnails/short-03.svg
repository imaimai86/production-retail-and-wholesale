<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2a3c46" stroke-width="1" opacity="0.45"/></pattern></defs><rect width="1080" height="1920" fill="#0c1316"/><rect width="1080" height="1920" fill="url(#g)"/><text x="80" y="150" fill="#3ddc84" font-size="32" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="700" letter-spacing="3">SHORT 03 · SDLC PIPELINE</text><text x="72" y="300" fill="#eef3f5" font-size="100" font-family="Archivo, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900">IT ASKS</text><text x="72" y="412" fill="#eef3f5" font-size="100" font-family="Archivo, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900">BEFORE</text><text x="72" y="524" fill="#ffb547" font-size="100" font-family="Archivo, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900">IT CODES</text><rect x="60" y="760" width="960" height="196" rx="14" fill="#152129" stroke="#2a3c46" stroke-width="3"/><text x="100" y="832" fill="#eef3f5" font-size="38" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="700">Q1  What is a valid name?</text><text x="100" y="892" fill="#3ddc84" font-size="32" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500">Suggested: a non-empty string</text><text x="100" y="934" fill="#90a4ae" font-size="26" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500">Answer: accept</text><rect x="60" y="990" width="960" height="196" rx="14" fill="#152129" stroke="#2a3c46" stroke-width="3"/><text x="100" y="1062" fill="#eef3f5" font-size="38" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="700">Q2  Extra fields like password?</text><text x="100" y="1122" fill="#3ddc84" font-size="32" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500">Suggested: ignored, not stored</text><text x="100" y="1164" fill="#90a4ae" font-size="26" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500">Answer: accept</text><rect x="60" y="1220" width="960" height="196" rx="14" fill="#152129" stroke="#2a3c46" stroke-width="3"/><text x="100" y="1292" fill="#eef3f5" font-size="38" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="700">Q4  Auth before validation?</text><text x="100" y="1352" fill="#3ddc84" font-size="32" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500">Suggested: auth runs first</text><text x="100" y="1394" fill="#90a4ae" font-size="26" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500">Answer: accept</text><text x="540" y="1500" fill="#90a4ae" font-size="34" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500" text-anchor="middle">+ 3 more questions</text><text x="80" y="1700" fill="#ffb547" font-size="50" font-family="Archivo, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="800">6 questions from one</text><text x="80" y="1762" fill="#ffb547" font-size="50" font-family="Archivo, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="800">vague bug report.</text><line x1="80" y1="1800" x2="1000" y2="1800" stroke="#2a3c46" stroke-width="2"/><text x="80" y="1856" fill="#90a4ae" font-size="30" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-weight="500">Open source · full video on the channel</text></svg>
